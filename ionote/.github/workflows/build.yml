# Does the app still build? On every pull request (and by hand: Actions › build › Run workflow). Nothing is signed or
# uploaded; TestFlight builds are made with tools/testflight.sh on a Mac. A macOS runner counts ten times its minutes
# on a private repository, so this builds one scheme and only when a pull request changes.
name: build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: The Xcode project (XcodeGen, from project.yml)
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate -q
      - name: Build the iPhone and iPad app
        run: >
          xcodebuild -project ionotes.xcodeproj -scheme ionotesiOS -configuration Debug
          -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO -quiet build
