name: iopix
options:
  bundleIdPrefix: net.iothing
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.2"  # the iPhone, iPad and Mac app; the Apple TV app has its own below
    CURRENT_PROJECT_VERSION: "1"
    # your Apple team id goes here (Xcode › Settings › Accounts); see README
    DEVELOPMENT_TEAM: 69M2JRAT8P
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  iopix:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - NativeWidget/Shared  # the widget's choices (the app prepares its photos, on Mac)
    entitlements:
      path: iOS/iopix.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)net.iothing.iopix
        keychain-access-groups: ["$(AppIdentifierPrefix)group.net.iothing.iopix"]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: ioPix sends the photos and videos you choose, and new ones if you turn that on, to your ioPix library.
        NSCameraUsageDescription: ioPix can take a photo for your ioPix library.
        NSMicrophoneUsageDescription: ioPix can record a video for your ioPix library.
        NSLocalNetworkUsageDescription: ioPix connects to your photo server on your home network.
        CFBundleURLTypes:  # the widget's links (Mac); not iopix:// which the separate Mac app answers
          - CFBundleURLName: net.iothing.iopix.native
            CFBundleURLSchemes: [iopix-native]
        NSServices:  # Finder › right-click › Services › Send to iopix Native (Mac; the plug-in answers it)
          - NSMenuItem: {default: Send to ioPix Native}
            NSMessage: sendToIopixNative
            NSPortName: iopix Native
            NSRequiredContext: {}
            NSSendFileTypes: [public.image, public.movie, public.folder]
        NSAppTransportSecurity:  # a self-hosted server may be plain http on the home network (an address, a .local or a bare name); anywhere else it is https
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        # on a Mac it sits beside the original Mac app (iopix.app), so it has its own name there
        APP_DISPLAY_NAME: ioPix
        "APP_DISPLAY_NAME[sdk=macosx*]": ioPix Native
        "PRODUCT_NAME[sdk=macosx*]": iopix Native
        PRODUCT_MODULE_NAME: iopix
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO  # one app on iPhone, iPad and Mac (one App Store record)
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: iopixShare
      - target: iopixMacBridge  # the menu bar icon, on Mac only
        platformFilter: macOS  # XcodeGen: the Mac Catalyst slice only
        embed: true
        codeSign: true
        copy:
          destination: plugins
      - target: iopixNativeWidget  # the desktop widget, on Mac only (the app feeds it there)
        platformFilter: macOS  # XcodeGen: the Mac Catalyst slice only
        embed: true
  iopixNativeWidget:
    type: app-extension
    platform: iOS
    sources:
      - NativeWidget
    entitlements:
      path: NativeWidget/iopixNativeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
    info:
      path: NativeWidget/Info.plist
      properties:
        CFBundleDisplayName: ioPix
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.widget
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SKIP_INSTALL: YES
  iopixMacBridge:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacBridge
    info:
      path: MacBridge/Info.plist
      properties:
        NSPrincipalClass: IopixStatusBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.macbridge
        SKIP_INSTALL: YES
  iopixShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared/Core
    entitlements:
      path: ShareExtension/iopixShare.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
        keychain-access-groups: ["$(AppIdentifierPrefix)group.net.iothing.iopix"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ioPix
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.share
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  iopixUploader:
    type: application
    platform: macOS
    sources:
      - Mac
      - path: Shared
        excludes: ["Library/**"]  # the browsing screens' code: iPhone, iPad and Apple TV only
      - MacWidgetShared
    dependencies:
      - target: iopixMacShare
      - target: iopixMacWidget
    entitlements:
      path: Mac/iopixUploader.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
        com.apple.security.application-groups: [69M2JRAT8P.net.iothing.iopix]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)net.iothing.iopix
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ioPix
        LSUIElement: false
        CFBundleURLTypes:
          - CFBundleURLName: net.iothing.iopix.uploader
            CFBundleURLSchemes: [iopix]
        NSServices:
          - NSMenuItem: {default: Send to ioPix}
            NSMessage: sendToIopix
            NSPortName: iopix
            NSRequiredContext: {}
            NSSendFileTypes: [public.image, public.movie, public.folder]
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: ioPix sends the photos and videos added to your Photos library to your ioPix library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_NAME: iopix
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.uploader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  iopixTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - TV
      - Shared/Core
      - Shared/Library
    dependencies:
      - target: iopixTopShelf
    entitlements:
      path: TV/iopixTV.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
    info:
      path: TV/Info.plist
      properties:
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ioPix
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: ioPix connects to your photo server on your home network.
        CFBundleURLTypes:
          - CFBundleURLName: net.iothing.iopix
            CFBundleURLSchemes: [iopix]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: iopix
        # the same id as the iPhone app: one App Store Connect app (and one TestFlight) for both
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        MARKETING_VERSION: "1.1.1"  # the Apple TV app: nothing changed there since
  iopixTopShelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - TopShelf
      - Shared/Core
    entitlements:
      path: TopShelf/iopixTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
    info:
      path: TopShelf/Info.plist
      properties:
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ioPix
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.topshelf
        MARKETING_VERSION: "1.1.1"
        TARGETED_DEVICE_FAMILY: "3"
  iopixMacShare:
    type: app-extension
    platform: macOS
    sources:
      - MacShare
    entitlements:
      path: MacShare/iopixMacShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [69M2JRAT8P.net.iothing.iopix]
        com.apple.security.files.user-selected.read-only: true
    info:
      path: MacShare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ioPix
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 200
              NSExtensionActivationSupportsMovieWithMaxCount: 200
              NSExtensionActivationSupportsFileWithMaxCount: 200
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.uploader.share
        ENABLE_HARDENED_RUNTIME: YES
  iopixMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - MacWidget
      - MacWidgetShared
    entitlements:
      path: MacWidget/iopixMacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [69M2JRAT8P.net.iothing.iopix]
    info:
      path: MacWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: ioPix
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.uploader.widget
        ENABLE_HARDENED_RUNTIME: YES
