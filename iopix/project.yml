name: iopix
options:
  bundleIdPrefix: net.iothing
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # your Apple team id goes here (Xcode › Settings › Accounts); see README
    DEVELOPMENT_TEAM: 69M2JRAT8P
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  iopix:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    entitlements:
      path: iOS/iopix.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
        keychain-access-groups: ["$(AppIdentifierPrefix)group.net.iothing.iopix"]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: iopix
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: iopix sends the photos and videos you choose, and new ones if you turn that on, to your iopix library.
        NSCameraUsageDescription: iopix can take a photo for your iopix library.
        NSLocalNetworkUsageDescription: iopix connects to your photo server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: iopixShare
  iopixShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared/Core
    entitlements:
      path: ShareExtension/iopixShare.entitlements
      properties:
        com.apple.security.application-groups: [group.net.iothing.iopix]
        keychain-access-groups: ["$(AppIdentifierPrefix)group.net.iothing.iopix"]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: iopix
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.share
        TARGETED_DEVICE_FAMILY: "1,2"
  iopixUploader:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
    entitlements:
      path: Mac/iopixUploader.entitlements
      properties:
        com.apple.security.personal-information.photos-library: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: iopix
        LSUIElement: false
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: iopix sends the photos and videos added to your Photos library to your iopix library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_NAME: iopix
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iopix.uploader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
