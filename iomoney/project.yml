# ioMoney: the iPhone and iPad app for the household's finances (ioMoney in ioSuite).
# The Xcode project is generated from this file:  brew install xcodegen && xcodegen
name: ioMoney

options:
  bundleIdPrefix: net.iothing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 69M2JRAT8P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ioMoney:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: ../shared/DeviceSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iomoney
        PRODUCT_NAME: ioMoney
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ioMoney
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # a server on the home network may be plain http
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ioMoney reads your accounts from your ioSuite server on your home network.
        NSCameraUsageDescription: Take a photo of a receipt to keep with a transaction.
        NSFaceIDUsageDescription: Unlock ioMoney with Face ID, so that your accounts stay yours when someone else holds your phone.

schemes:
  ioMoney:
    build:
      targets:
        ioMoney: all
    run:
      config: Debug
    archive:
      config: Release
