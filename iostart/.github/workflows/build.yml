# Does the app still build? On every pull request (and by hand: Actions › build › Run workflow). Nothing is signed or
# uploaded; signed builds for a phone or TestFlight are made on a Mac with the team's certificate (README.md). A macOS
# runner counts ten times its minutes on a private repository, so this runs only for pull requests.
name: build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: The Xcode project (XcodeGen, from project.yml)
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate -q
      - name: Build ioStart for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project ioStart.xcodeproj -scheme ioStart -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -n 150
