# ioStart: the iPhone and iPad app for the start page: your day, your news feeds and the bookmarks, with its share
# extension and its widgets.
# The Xcode project is generated from this file:  brew install xcodegen && xcodegen
name: ioStart

options:
  bundleIdPrefix: net.iothing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 69M2JRAT8P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ioStart:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: ../shared/DeviceSignIn
      - Intents
    dependencies:
      - target: ioStartShare
      - target: ioStartWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iostart
        PRODUCT_NAME: ioStart
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ioStart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iostart://open?id=<bookmark> and ?url=<page>: the widgets' links (Shared/DeepLink.swift)
        CFBundleURLTypes:
          - CFBundleURLName: net.iothing.iostart
            CFBundleURLSchemes: [iostart]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # a start page on the home network may be plain http; the built-in browser opens whatever was bookmarked
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: iOS/ioStart.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.iothing.iostart

  ioStartShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - path: ../shared/DeviceSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iostart.share
        PRODUCT_NAME: ioStartShare
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ioStart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ioStartShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.iothing.iostart

  ioStartWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: ../shared/DeviceSignIn
      - Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iostart.widgets
        PRODUCT_NAME: ioStartWidgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ioStart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ioStartWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.iothing.iostart

schemes:
  ioStart:
    build:
      targets:
        ioStart: all
    run:
      config: Debug
    archive:
      config: Release
