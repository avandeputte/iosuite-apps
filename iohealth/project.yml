# XcodeGen spec: `xcodegen generate` in this folder makes ioHealth.xcodeproj (brew install xcodegen). See README.
name: ioHealth
options:
  bundleIdPrefix: com.avandeputte
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.20.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # your Apple team id (Xcode › Settings › Accounts), the same as ionotes and iopix
    DEVELOPMENT_TEAM: 69M2JRAT8P
targets:
  ioHealth:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.entitlements"]
      - Shared/SyncProtocol.swift
    entitlements:
      path: iOS/ioHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ioHealth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: ioHealth reads your Health data so it can be copied to your own server.
        NSHealthUpdateUsageDescription: ioHealth never writes to Health.
        NSLocalNetworkUsageDescription: ioHealth sends your Health data to your own server, which may be on your local network.
        # https everywhere, except plain http to local addresses (e.g. http://192.168.1.10:8650).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.avandeputte.healthsync.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        # Kept from the app's old name, Health Sync: a new bundle ID would be a new app to iOS, losing the saved token,
        # sync history and Health permissions.
        PRODUCT_BUNDLE_IDENTIFIER: com.avandeputte.healthsync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
