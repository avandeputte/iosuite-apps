# XcodeGen spec: `xcodegen generate` in this folder makes ioHealthSync.xcodeproj (brew install xcodegen). See README.
name: ioHealthSync
options:
  bundleIdPrefix: net.iothing
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.20.2"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # your Apple team id (Xcode › Settings › Accounts), the same as ionotes and iopix
    DEVELOPMENT_TEAM: 69M2JRAT8P
targets:
  ioHealthSync:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.entitlements"]
      - Shared/SyncProtocol.swift
    entitlements:
      path: iOS/ioHealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ioHealthSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: ioHealthSync reads your Health data so it can be copied to your own server.
        NSHealthUpdateUsageDescription: ioHealthSync never writes to Health.
        NSLocalNetworkUsageDescription: ioHealthSync sends your Health data to your own server, which may be on your local network.
        # https everywhere, except plain http to local addresses (e.g. http://192.168.1.10:8650).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [net.iothing.ioHealthSync.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.ioHealthSync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
